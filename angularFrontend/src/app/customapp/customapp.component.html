<div>
    <h1>Create Streamlit App</h1>
    <form (ngSubmit)="onSubmit()">
      <label for="appName">App Name:</label>
      <input type="text" id="appName" [(ngModel)]="appName" name="appName" required>
      
      <label for="portNumber">Port Number:</label>
      <input type="number" id="portNumber" [(ngModel)]="portNumber" name="portNumber" required>
      
      <button type="submit">Create App</button>
    </form>
  </div>
